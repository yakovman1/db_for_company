services:
  setup-folders:
    image: alpine:latest
    container_name: setup_folders
    volumes:
      - .:/infra
    # Используем формат списка, чтобы Docker не запутался в кавычках и пробелах
    command:
      - sh
      - -c
      - mkdir -p /infra/airflow/dags /infra/airflow/logs /infra/airflow/plugins /infra/superset/conf

  postgres:
    image: postgres:18.4
    container_name: company_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data_pg18:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5

# 2. КЭШ ДЛЯ SUPERSET/AIRFLOW
  redis:
    image: redis:7-alpine
    container_name: company_redis
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES:-/data}
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS:-0.0.0.0:9000}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Web-консоль
    volumes:
      - rustfs_data:/data

  rustfs-create-buckets:
    image: quay.io/minio/mc:latest
    container_name: rustfs-create-buckets
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://rustfs:9000 ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY} &&
      mc mb -p local/${MINIO_BUCKET_FAMILIES} || true &&
      mc mb -p local/${MINIO_BUCKET_PREVIEW} || true &&
      exit 0
      "

  rustfs-migration:
    image: rustfs/rustfs:latest
    container_name: rustfs-migration
    restart: "no"
    profiles:
      - migration
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES:-/data}
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS:-0.0.0.0:9000}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - rustfs_data:/data

  minio-old:
    image: quay.io/minio/minio:latest
    container_name: minio-old
    command: server /data --console-address ":9001"
    restart: "no"
    profiles:
      - migration-legacy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9100:9000"  # Legacy MinIO API for migration only
      - "9101:9001"  # Legacy MinIO console for migration only
    volumes:
      - minio_data:/data

  migrate-minio-to-rustfs:
    image: quay.io/minio/mc:latest
    container_name: migrate-minio-to-rustfs
    depends_on:
      - rustfs-migration
    profiles:
      - migration
    environment:
      MIGRATION_MINIO_ENDPOINT: ${MIGRATION_MINIO_ENDPOINT:-http://minio:9000}
      MIGRATION_RUSTFS_ENDPOINT: http://rustfs-migration:9000
    entrypoint: >
      /bin/sh -c "
      until mc alias set minio-old $$MIGRATION_MINIO_ENDPOINT ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
      until mc alias set rustfs-new $$MIGRATION_RUSTFS_ENDPOINT ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY}; do sleep 2; done &&
      mc mb -p rustfs-new/${MINIO_BUCKET_FAMILIES} || true &&
      mc mb -p rustfs-new/${MINIO_BUCKET_PREVIEW} || true &&
      mc mirror --overwrite minio-old/${MINIO_BUCKET_FAMILIES} rustfs-new/${MINIO_BUCKET_FAMILIES} &&
      mc mirror --overwrite minio-old/${MINIO_BUCKET_PREVIEW} rustfs-new/${MINIO_BUCKET_PREVIEW}
      "
# 5. AIRFLOW (Инициализация таблиц и админа)
  airflow-init:
    image: apache/airflow:3.2.2
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username ${AIRFLOW_ADMIN_USER} --firstname Admin --lastname Admin --role Admin --email ${AIRFLOW_ADMIN_EMAIL} --password ${AIRFLOW_ADMIN_PASSWORD} || true

  # 6. AIRFLOW (API server + UI)
  airflow-api-server:
    image: apache/airflow:3.2.2
    container_name: airflow_api_server
    restart: unless-stopped
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      setup-folders:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: api-server

  # 7. AIRFLOW (Планировщик)
  airflow-scheduler:
    image: apache/airflow:3.2.2
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: scheduler

  airflow-dag-processor:
    image: apache/airflow:3.2.2
    container_name: airflow_dag_processor
    restart: unless-stopped
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: dag-processor

  # 8. SUPERSET (Инициализация)
  superset-init:
    build:
      context: ./config
      dockerfile: Dockerfile.superset
    image: company-superset:6.1.0
    user: "0:0"
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/superset
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_APP_NAME: ${SUPERSET_APP_NAME:-ATP architekten ingenieure}
      SUPERSET_APP_ICON: ${SUPERSET_APP_ICON:-}
      SUPERSET_LOGO_S3_BUCKET: ${SUPERSET_LOGO_S3_BUCKET:-for-superset}
      SUPERSET_LOGO_S3_KEY: ${SUPERSET_LOGO_S3_KEY:-}
      SUPERSET_LOGO_S3_KEY_DARK: ${SUPERSET_LOGO_S3_KEY_DARK:-}
      SUPERSET_FAVICON_S3_KEY: ${SUPERSET_FAVICON_S3_KEY:-ATP_TLP.jpg}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://rustfs:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      SUPERSET_LOGO_TARGET_PATH: ${SUPERSET_LOGO_TARGET_PATH:-/superset/welcome/}
      SUPERSET_BRAND_COLOR: ${SUPERSET_BRAND_COLOR:-#CC0033}
      SUPERSET_BRAND_COLOR_LINK: ${SUPERSET_BRAND_COLOR_LINK:-#CC0033}
      SUPERSET_BRAND_COLOR_TEXT: ${SUPERSET_BRAND_COLOR_TEXT:-#000000}
      SUPERSET_BRAND_COLOR_NEUTRAL: ${SUPERSET_BRAND_COLOR_NEUTRAL:-#666666}
      SUPERSET_BRAND_COLOR_BG: ${SUPERSET_BRAND_COLOR_BG:-#E6E6E6}
      SUPERSET_BRAND_COLOR_SURFACE: ${SUPERSET_BRAND_COLOR_SURFACE:-#FFFFFF}
      SUPERSET_BRAND_COLOR_SUCCESS: ${SUPERSET_BRAND_COLOR_SUCCESS:-#666666}
      SUPERSET_BRAND_COLOR_WARNING: ${SUPERSET_BRAND_COLOR_WARNING:-#666666}
      SUPERSET_BRAND_COLOR_ERROR: ${SUPERSET_BRAND_COLOR_ERROR:-#CC0033}
      SUPERSET_BRAND_COLOR_INFO: ${SUPERSET_BRAND_COLOR_INFO:-#666666}
      SUPERSET_BRAND_FONT_UI: ${SUPERSET_BRAND_FONT_UI:-Univers, Linotype Univers, Helvetica Neue, Helvetica, Arial, sans-serif}
      SUPERSET_BRAND_FONT_CODE: ${SUPERSET_BRAND_FONT_CODE:-Univers, Linotype Univers, Courier New, monospace}
      SUPERSET_LOGO_HEIGHT: ${SUPERSET_LOGO_HEIGHT:-64px}
      SUPERSET_LOGO_MAX_WIDTH: ${SUPERSET_LOGO_MAX_WIDTH:-360}
      SUPERSET_ROW_LIMIT: ${SUPERSET_ROW_LIMIT:-50000}
      SUPERSET_SQL_MAX_ROW: ${SUPERSET_SQL_MAX_ROW:-100000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
    volumes:
      - ./config/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./config/superset_branding:/app/superset/static/assets/images/branding
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /app/superset/static/assets/images/branding
        chown -R superset:superset /app/superset/static/assets/images/branding
        su superset -s /bin/bash -c "/app/sync_superset_branding.sh"
        su superset -s /bin/bash -c "superset db upgrade"
        su superset -s /bin/bash -c "superset fab create-admin --username ${SUPERSET_ADMIN_USER} --firstname Admin --lastname Admin --email ${SUPERSET_ADMIN_EMAIL} --password ${SUPERSET_ADMIN_PASSWORD}" || true
        su superset -s /bin/bash -c "superset init"

  # 9. SUPERSET (Веб-интерфейс)
  superset:
    build:
      context: ./config
      dockerfile: Dockerfile.superset
    image: company-superset:6.1.0
    container_name: superset
    restart: unless-stopped
    depends_on:
      superset-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      setup-folders:
        condition: service_completed_successfully
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/superset
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_APP_NAME: ${SUPERSET_APP_NAME:-ATP architekten ingenieure}
      SUPERSET_APP_ICON: ${SUPERSET_APP_ICON:-}
      SUPERSET_LOGO_S3_BUCKET: ${SUPERSET_LOGO_S3_BUCKET:-for-superset}
      SUPERSET_LOGO_S3_KEY: ${SUPERSET_LOGO_S3_KEY:-}
      SUPERSET_LOGO_S3_KEY_DARK: ${SUPERSET_LOGO_S3_KEY_DARK:-}
      SUPERSET_FAVICON_S3_KEY: ${SUPERSET_FAVICON_S3_KEY:-ATP_TLP.jpg}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://rustfs:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      SUPERSET_LOGO_TARGET_PATH: ${SUPERSET_LOGO_TARGET_PATH:-/superset/welcome/}
      SUPERSET_BRAND_COLOR: ${SUPERSET_BRAND_COLOR:-#CC0033}
      SUPERSET_BRAND_COLOR_LINK: ${SUPERSET_BRAND_COLOR_LINK:-#CC0033}
      SUPERSET_BRAND_COLOR_TEXT: ${SUPERSET_BRAND_COLOR_TEXT:-#000000}
      SUPERSET_BRAND_COLOR_NEUTRAL: ${SUPERSET_BRAND_COLOR_NEUTRAL:-#666666}
      SUPERSET_BRAND_COLOR_BG: ${SUPERSET_BRAND_COLOR_BG:-#E6E6E6}
      SUPERSET_BRAND_COLOR_SURFACE: ${SUPERSET_BRAND_COLOR_SURFACE:-#FFFFFF}
      SUPERSET_BRAND_COLOR_SUCCESS: ${SUPERSET_BRAND_COLOR_SUCCESS:-#666666}
      SUPERSET_BRAND_COLOR_WARNING: ${SUPERSET_BRAND_COLOR_WARNING:-#666666}
      SUPERSET_BRAND_COLOR_ERROR: ${SUPERSET_BRAND_COLOR_ERROR:-#CC0033}
      SUPERSET_BRAND_COLOR_INFO: ${SUPERSET_BRAND_COLOR_INFO:-#666666}
      SUPERSET_BRAND_FONT_UI: ${SUPERSET_BRAND_FONT_UI:-Univers, Linotype Univers, Helvetica Neue, Helvetica, Arial, sans-serif}
      SUPERSET_BRAND_FONT_CODE: ${SUPERSET_BRAND_FONT_CODE:-Univers, Linotype Univers, Courier New, monospace}
      SUPERSET_LOGO_HEIGHT: ${SUPERSET_LOGO_HEIGHT:-64px}
      SUPERSET_LOGO_MAX_WIDTH: ${SUPERSET_LOGO_MAX_WIDTH:-360}
      SUPERSET_ROW_LIMIT: ${SUPERSET_ROW_LIMIT:-50000}
      SUPERSET_SQL_MAX_ROW: ${SUPERSET_SQL_MAX_ROW:-100000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
    volumes:
      - superset_home:/app/superset_home
      - ./config/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./config/superset_branding:/app/superset/static/assets/images/branding:ro
    ports:
      - "8088:8088"

  backend:
    build: ./backet
    restart: unless-stopped
    depends_on:
      - postgres
      - rustfs
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    ports:
      - "8000:8000"
volumes:
  rustfs_data:
    driver: local
  minio_data:
    driver: local
  superset_home: